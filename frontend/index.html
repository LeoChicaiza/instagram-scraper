<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaScope — Instagram Profile Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0c0f;
      --bg2:      #111318;
      --bg3:      #181b22;
      --border:   #222530;
      --accent:   #e8ff47;
      --accent2:  #ff6b47;
      --muted:    #4a4f62;
      --text:     #e8eaf0;
      --text2:    #8a8fa8;
      --radius:   6px;
      --font-head: 'Bebas Neue', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(11,12,15,0.9);
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .logo-text {
      font-family: var(--font-head);
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--text);
    }
    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      margin-bottom: 4px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .header-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text2);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3ddc84;
      animation: pulse 1.5s infinite;
    }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* ── SEARCH BOX ── */
    .search-section {
      margin-bottom: 48px;
    }
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .search-title {
      font-family: var(--font-head);
      font-size: 3.5rem;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 24px;
    }
    .search-title span { color: var(--accent); }

    .search-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      max-width: 640px;
    }
    .input-wrap {
      flex: 1;
      position: relative;
    }
    .at-sign {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 1rem;
      pointer-events: none;
    }
    input[type="text"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      padding: 14px 16px 14px 36px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    input[type="text"]::placeholder { color: var(--muted); }

    .posts-select {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text2);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 14px 12px;
      outline: none;
      cursor: pointer;
    }

    .btn-scrape {
      background: var(--accent);
      color: #0b0c0f;
      font-family: var(--font-head);
      font-size: 1rem;
      letter-spacing: 2px;
      border: none;
      border-radius: var(--radius);
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn-scrape:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-scrape:active { transform: translateY(0); }
    .btn-scrape:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── PROGRESS / STATUS ── */
    #status-area {
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      display: none;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text2);
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-line { color: var(--accent2); }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 48px 0;
    }

    /* ── PROFILE CARD ── */
    #profile-section { display: none; }

    .profile-header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 32px;
      align-items: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .profile-header::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(232,255,71,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .avatar-wrap {
      width: 90px; height: 90px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--accent);
      flex-shrink: 0;
    }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: var(--bg3);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .profile-info { }
    .profile-name {
      font-family: var(--font-head);
      font-size: 2.2rem;
      letter-spacing: 1px;
      line-height: 1;
    }
    .profile-handle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
      margin: 4px 0 10px;
    }
    .profile-bio {
      font-size: 0.88rem;
      color: var(--text2);
      max-width: 500px;
      line-height: 1.5;
    }
    .badges {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-verified { background: rgba(232,255,71,0.15); color: var(--accent); border: 1px solid rgba(232,255,71,0.3); }
    .badge-public { background: rgba(61,220,132,0.1); color: #3ddc84; border: 1px solid rgba(61,220,132,0.25); }
    .badge-private { background: rgba(255,107,71,0.1); color: var(--accent2); border: 1px solid rgba(255,107,71,0.25); }

    /* ── STATS STRIP ── */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .stat-box {
      background: var(--bg2);
      padding: 24px 20px;
      text-align: center;
    }
    .stat-value {
      font-family: var(--font-head);
      font-size: 2rem;
      letter-spacing: 1px;
      color: var(--text);
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── POSTS GRID ── */
    .posts-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .posts-title {
      font-family: var(--font-head);
      font-size: 1.6rem;
      letter-spacing: 1px;
    }
    .posts-count-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .post-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .post-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .post-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--bg3);
      display: block;
    }
    .post-thumb-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--muted);
    }

    .post-body {
      padding: 16px;
    }
    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .post-date {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--muted);
    }
    .post-type {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg3);
      color: var(--text2);
      border: 1px solid var(--border);
    }

    .post-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 10px;
    }
    .post-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text2);
    }
    .post-stat svg { opacity: 0.6; }

    .post-caption {
      font-size: 0.8rem;
      color: var(--text2);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }
    .post-tag {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--accent);
      background: rgba(232,255,71,0.07);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .post-link {
      display: inline-block;
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text2);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      transition: border-color 0.2s, color 0.2s;
    }
    .post-link:hover { border-color: var(--accent); color: var(--accent); }

    /* ── JSON DUMP ── */
    .json-section { margin-top: 48px; }
    .json-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .btn-copy {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 1px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: var(--radius);
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    pre#json-output {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text2);
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.7;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      main { padding: 24px 20px; }
      header { padding: 16px 20px; }
      .search-title { font-size: 2.2rem; }
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .profile-header { grid-template-columns: 1fr; text-align: center; }
      .avatar-wrap { margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">INSTASCOPE</span>
      <span class="header-tag">/ scraper</span>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      API LIVE · localhost:5000
    </div>
  </header>

  <main>
    <!-- ── SEARCH ── -->
    <section class="search-section">
      <p class="section-label">// extracción de datos</p>
      <h1 class="search-title">Analiza cualquier<br>perfil <span>público</span></h1>

      <div class="search-bar">
        <div class="input-wrap">
          <span class="at-sign">@</span>
          <input type="text" id="username-input" placeholder="username" autocomplete="off" spellcheck="false" />
        </div>
        <select class="posts-select" id="max-posts">
          <option value="10">10 posts</option>
          <option value="15">15 posts</option>
          <option value="20">20 posts</option>
          <option value="30">30 posts</option>
          <option value="50">50 posts</option>
        </select>
        <button class="btn-scrape" id="btn-scrape" onclick="runScrape()">SCRAPE</button>
      </div>

      <div id="status-area">
        <div class="status-line" id="status-line">
          <div class="spinner"></div>
          <span id="status-text">Iniciando extracción...</span>
        </div>
      </div>
    </section>

    <hr class="divider" />

    <!-- ── PROFILE RESULTS ── -->
    <section id="profile-section">
      <!-- Profile header -->
      <div class="profile-header" id="profile-header"></div>

      <!-- Stats strip -->
      <div class="stats-strip" id="stats-strip"></div>

      <!-- Posts -->
      <div class="posts-header">
        <h2 class="posts-title">PUBLICACIONES</h2>
        <span class="posts-count-tag" id="posts-count-tag"></span>
      </div>
      <div class="posts-grid" id="posts-grid"></div>

      <!-- JSON dump -->
      <div class="json-section">
        <div class="json-header">
          <p class="section-label">// raw json output</p>
          <button class="btn-copy" onclick="copyJSON()">COPIAR JSON</button>
        </div>
        <pre id="json-output"></pre>
      </div>
    </section>
  </main>

  <footer>INSTASCOPE — USO EDUCATIVO · NO AFILIADO CON META / INSTAGRAM · 2025</footer>

  <script>
    const API = 'http://localhost:5000';
    let lastData = null;

    function fmt(n) {
      if (n >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n/1_000).toFixed(1) + 'K';
      return n?.toLocaleString() ?? '—';
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('es-EC', { year:'numeric', month:'short', day:'numeric' });
    }

    function setStatus(msg, isError = false) {
      const area = document.getElementById('status-area');
      const line = document.getElementById('status-line');
      const text = document.getElementById('status-text');
      area.style.display = 'block';
      text.textContent = msg;
      line.className = 'status-line' + (isError ? ' error-line' : '');
      if (isError) line.querySelector('.spinner')?.remove();
    }

    async function runScrape() {
      const username = document.getElementById('username-input').value.trim().replace('@','');
      const maxPosts = document.getElementById('max-posts').value;
      if (!username) return;

      const btn = document.getElementById('btn-scrape');
      btn.disabled = true;
      document.getElementById('profile-section').style.display = 'none';

      const area = document.getElementById('status-area');
      area.style.display = 'block';
      document.getElementById('status-line').className = 'status-line';
      document.getElementById('status-line').innerHTML =
        '<div class="spinner"></div><span id="status-text">Extrayendo @' + username + '…</span>';

      try {
        const res = await fetch(`${API}/api/scrape`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, max_posts: parseInt(maxPosts) })
        });
        const result = await res.json();

        if (!result.success) {
          setStatus('❌ ' + result.error, true);
          btn.disabled = false;
          return;
        }

        setStatus('✓ Extracción completada — ' + result.data.posts.length + ' publicaciones');
        document.getElementById('status-line').querySelector('.spinner')?.remove();
        renderProfile(result.data);
        btn.disabled = false;

      } catch (e) {
        setStatus('❌ No se pudo conectar con la API. ¿Está corriendo el backend?', true);
        btn.disabled = false;
      }
    }

    function renderProfile(data) {
      lastData = data;
      document.getElementById('profile-section').style.display = 'block';

      // Header
      const picHTML = data.profile_pic_url
        ? `<div class="avatar-wrap"><img src="${data.profile_pic_url}" alt="avatar" onerror="this.parentElement.outerHTML='<div class=avatar-placeholder>👤</div>'" /></div>`
        : `<div class="avatar-placeholder">👤</div>`;

      const badges = [
        data.is_verified ? `<span class="badge badge-verified">✓ VERIFICADO</span>` : '',
        data.is_private
          ? `<span class="badge badge-private">🔒 PRIVADO</span>`
          : `<span class="badge badge-public">◉ PÚBLICO</span>`,
      ].join('');

      document.getElementById('profile-header').innerHTML = `
        ${picHTML}
        <div class="profile-info">
          <div class="profile-name">${data.full_name || data.username}</div>
          <div class="profile-handle">@${data.username}</div>
          ${data.biography ? `<div class="profile-bio">${data.biography}</div>` : ''}
          <div class="badges">${badges}</div>
        </div>
      `;

      // Stats
      document.getElementById('stats-strip').innerHTML = `
        <div class="stat-box">
          <div class="stat-value">${fmt(data.followers)}</div>
          <div class="stat-label">Seguidores</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${fmt(data.followees)}</div>
          <div class="stat-label">Siguiendo</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${fmt(data.posts_count)}</div>
          <div class="stat-label">Total Posts</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${data.posts.length}</div>
          <div class="stat-label">Extraídos</div>
        </div>
      `;

      // Posts
      document.getElementById('posts-count-tag').textContent = data.posts.length + ' publicaciones recuperadas';
      const grid = document.getElementById('posts-grid');
      grid.innerHTML = '';

      data.posts.forEach((post, i) => {
        const tags = post.hashtags.slice(0, 4).map(t => `<span class="post-tag">#${t}</span>`).join('');
        const card = document.createElement('div');
        card.className = 'post-card';
        card.style.animationDelay = (i * 0.06) + 's';

        const thumbHTML = post.thumbnail_url
          ? `<img class="post-thumb" src="${post.thumbnail_url}" alt="post" loading="lazy" onerror="this.outerHTML='<div class=post-thumb-placeholder>${post.media_type === 'Video' ? '▶' : '🖼'}</div>'" />`
          : `<div class="post-thumb-placeholder">${post.media_type === 'Video' ? '▶' : '🖼'}</div>`;

        card.innerHTML = `
          ${thumbHTML}
          <div class="post-body">
            <div class="post-meta">
              <span class="post-date">${fmtDate(post.date)}</span>
              <span class="post-type">${post.media_type}</span>
            </div>
            <div class="post-stats">
              <span class="post-stat">
                <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                ${fmt(post.likes)}
              </span>
              <span class="post-stat">
                <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                ${fmt(post.comments)}
              </span>
              ${post.location ? `<span class="post-stat">📍 ${post.location}</span>` : ''}
            </div>
            ${post.caption ? `<p class="post-caption">${post.caption}</p>` : ''}
            ${tags ? `<div class="post-tags">${tags}</div>` : ''}
            <a class="post-link" href="${post.url}" target="_blank" rel="noopener">↗ Ver post</a>
          </div>
        `;
        grid.appendChild(card);
      });

      // JSON
      document.getElementById('json-output').textContent = JSON.stringify(data, null, 2);

      // Scroll to results
      document.getElementById('profile-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function copyJSON() {
      if (!lastData) return;
      navigator.clipboard.writeText(JSON.stringify(lastData, null, 2))
        .then(() => {
          const btn = document.querySelector('.btn-copy');
          btn.textContent = '✓ COPIADO';
          setTimeout(() => btn.textContent = 'COPIAR JSON', 2000);
        });
    }

    // Enter key trigger
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('username-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') runScrape();
      });
    });
  </script>
</body>
</html>
